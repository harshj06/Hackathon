<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#10152c;color:#edf2ff;font:16px system-ui}main{padding:22px;max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;gap:12px;color:#aebde4;font-size:13px}h2{font-size:24px;margin:14px 0 8px}#arena{position:relative;height:310px;background:radial-gradient(ellipse at bottom,#283a65,#131a33);border:1px solid #485881;border-radius:18px;overflow:hidden;margin:16px 0}canvas{width:100%;height:100%}button{background:#293957;color:white;border:1px solid #687caa;border-radius:12px;padding:14px;cursor:pointer;font:inherit}button:hover,button:focus-visible{background:#475b91;outline:2px solid #83e7d2}button:disabled{opacity:.5;cursor:default}#answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}#message{min-height:48px;color:#8ee8cf;padding:12px 0}progress{width:100%;accent-color:#80e5cd}nav{display:flex;gap:10px;justify-content:center}small{display:block;color:#aebde4;margin-top:12px}.hidden{display:none}
</style></head><body><main><header><span>✦ BUDDY · STAR RUN</span><span id="score">0 stars</span></header><h2 id="prompt"></h2><progress id="progress" value="0" max="3"></progress><div id="arena"><canvas id="world" aria-label="Move Buddy to an answer portal using arrows, then press Enter"></canvas></div><div id="answers"></div><div id="message" role="status" aria-live="polite"></div><nav><button id="left" aria-label="Move left">←</button><button id="enter">Enter portal</button><button id="right" aria-label="Move right">→</button><button id="next" class="hidden">Next checkpoint →</button><button id="replay" class="hidden">Play again ↻</button></nav><small>Arrow keys to move · Enter to choose · Or tap an answer portal. No timer, no lost lives.</small></main><script>
const data=__GAME_DATA__;
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
let round=0,stars=0,lane=0,locked=false,used=[],x=.5,feedback=false;
const $=id=>document.getElementById(id), reduced=data.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches;
function available(){return data.options.map((v,i)=>i).filter(i=>data.mode==='scenario'||!used.includes(i))}
function draw(t=0){const w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);const W=canvas.clientWidth,H=canvas.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#8ca7d8';for(let i=0;i<35;i++){ctx.globalAlpha=.3+(i%3)*.2;ctx.fillRect((i*137)%W,(i*53)%H,2,2)}ctx.globalAlpha=1;const opts=available();opts.forEach((v,i)=>{const px=(i+.5)*W/opts.length;ctx.strokeStyle=i===lane?'#8ff5d7':'#667eac';ctx.lineWidth=i===lane?5:2;ctx.beginPath();ctx.ellipse(px,82,Math.min(42,W/opts.length/3),53,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ecf2ff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(String(i+1),px,89)});const target=(lane+.5)/Math.max(opts.length,1);x=reduced?target:x+(target-x)*.13;const px=x*W,py=H-64+(reduced?0:Math.sin(t/250)*3);ctx.fillStyle='#b7a4ff';ctx.beginPath();ctx.roundRect(px-22,py-25,44,46,15);ctx.fill();ctx.fillStyle='#161c36';ctx.fillRect(px-11,py-10,6,8);ctx.fillRect(px+6,py-10,6,8);ctx.strokeStyle='#161c36';ctx.beginPath();ctx.arc(px,py+3,8,0,Math.PI);ctx.stroke();if(!reduced)requestAnimationFrame(draw)}
function render(){locked=false;feedback=false;lane=0;$('prompt').textContent=data.mode==='order'?'Build the path: '+data.prompts[round]:data.prompts[round];$('progress').max=data.prompts.length;$('progress').value=round;$('score').textContent=stars+' stars';$('message').textContent=data.mode==='match'?'Find the portal that matches this idea.':data.mode==='order'?'Choose the next step to open the path.':'Choose a portal to help Buddy solve this challenge.';$('next').classList.add('hidden');$('answers').replaceChildren();available().forEach((v,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' · '+data.options[v];b.onclick=()=>{lane=i;choose()};$('answers').append(b)});if(reduced)draw()}
function move(d){if(locked)return;lane=(lane+d+available().length)%available().length;if(reduced)draw()}
function choose(){if(locked)return;const chosen=available()[lane];if(chosen!==data.correct[round]){feedback=true;$('message').textContent='That portal is closed. Look again and try another.';return}locked=true;stars+=feedback?1:3;$('score').textContent=stars+' stars';$('message').textContent='✦ Portal unlocked! '+(data.mode==='scenario'?data.explanation:'You found the connection.');$('progress').value=round+1;Array.from($('answers').children).forEach(b=>b.disabled=true);if(round+1===data.prompts.length){$('message').textContent='✦ Mission complete! '+stars+' stars collected. '+data.explanation;$('replay').classList.remove('hidden');$('enter').disabled=true}else $('next').classList.remove('hidden');if(reduced)draw()}
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('enter').onclick=choose;$('next').onclick=()=>{if(data.mode!=='scenario')used.push(data.correct[round]);round++;render()};$('replay').onclick=()=>{round=0;stars=0;used=[];$('replay').classList.add('hidden');$('enter').disabled=false;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(['ArrowLeft','ArrowRight','Enter'].includes(e.key)){e.preventDefault();if(e.key==='Enter')choose();else move(e.key==='ArrowLeft'?-1:1)}});render();if(!reduced)requestAnimationFrame(draw);
</script></body></html>
