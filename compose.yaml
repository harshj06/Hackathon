services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cognify
      POSTGRES_USER: cognify
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognify"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://cognify:${DATABASE_PASSWORD}@postgres/cognify
      REDIS_URL: redis://redis:6379/0
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
